<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取票成功</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 480px;
      height: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .icon {
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
      background: #00c853;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 200, 83, 0.3);
    }
    .icon::after {
      content: "✓";
      color: #fff;
      font-size: 72px;
      font-weight: bold;
    }
    .title {
      font-size: 48px;
      color: #00695c;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 4px;
    }
    .desc {
      font-size: 24px;
      color: #00796b;
    }

  </style>
</head>
<body>
  <div class="icon"></div>
  <div class="title">取票成功！</div>
  <div class="desc">请妥善保管您的票据</div>
</body>
</html>
